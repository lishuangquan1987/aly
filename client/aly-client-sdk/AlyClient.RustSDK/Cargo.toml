[package]
name = "alyclient"
version = "1.0.0"
edition = "2021"
description = "Aly auto-update client SDK for Rust. Wraps aly-client and provides a managed update lifecycle."
license = "MIT"
repository = "https://github.com/lishuangquan1987/aly"
keywords = ["aly", "auto-update", "updater"]
categories = ["api-bindings", "development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"