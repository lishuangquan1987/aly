# 部署 VitePress 站点到 GitHub Pages
# 仓库 Settings → Pages → Source 需选择 "GitHub Actions"（首次启用后自动生效）
name: 文档同步 (Deploy Website)

on:
  push:
    branches: [master]
    paths: ['website/**', '.github/workflows/website.yml']
  # 发布 Release 时立即重建一次；若此刻资产还在上传，生成脚本会沿用仓库内快照，
  # 随后 Release Build 上传完成后会再触发一次带 tag 的同步，链接最终一定对齐。
  release:
    types: [published]
  # 手动触发：可指定 tag，留空则取最新 Release
  workflow_dispatch:
    inputs:
      release_tag:
        description: '指定 Release tag（例如 v0.1.11；留空 = 最新）'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # lastUpdated 需要完整历史
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      # 每次部署前拉取最新 Release 的资产清单，页面里的文件名/版本号/下载链接随之更新。
      - name: Generate release download links
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ALY_RELEASE_TAG: ${{ inputs.release_tag || '' }}
        run: node scripts/gen-release-assets.mjs
        working-directory: website
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: website
      - name: Build site
        run: pnpm build
        working-directory: website
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
