# 部署 VitePress 站点到 GitHub Pages
# 仓库 Settings → Pages → Source 需选择 "GitHub Actions"（首次启用后自动生效）
name: 文档同步 (Deploy Website)

on:
  push:
    branches: [master]
    paths: ['website/**', '.github/workflows/website.yml']
  # 注意：不能用 release 事件直接触发本 workflow。github-pages environment 启用了
  # 自定义分支策略（只允许 master），而 release 事件的 ref 是 tag（refs/tags/vX.Y.Z），
  # deploy job 会在启动前被环境规则拒绝（steps 为空、3 秒即 failure）。
  # 发布后的链接刷新改由 release.yml 的 "Refresh website download links" 步骤完成：
  # 它在资产全部上传后以 --ref master 触发本 workflow（带 release_tag），可通过环境规则。
  # 手动触发：可指定 tag，留空则取最新 Release
  workflow_dispatch:
    inputs:
      release_tag:
        description: '指定 Release tag（例如 v0.1.11；留空 = 最新）'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # lastUpdated 需要完整历史
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      # 每次部署前拉取最新 Release 的资产清单，页面里的文件名/版本号/下载链接随之更新。
      - name: Generate release download links
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ALY_RELEASE_TAG: ${{ inputs.release_tag || '' }}
        run: node scripts/gen-release-assets.mjs
        working-directory: website
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: website
      - name: Build site
        run: pnpm build
        working-directory: website
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
