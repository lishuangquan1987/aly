name: Release Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如 v0.0.1；留空 = 仅构建，不发布)'
        required: false
        type: string
      upload_to_release:
        description: '构建完成后上传产物到 Release'
        required: false
        type: boolean
        default: false

# 统一解析版本号：release 事件用 tag；手动触发有 version 用 version；
# 否则生成临时构建版本号（仅构建模式）。格式必须同时满足
# npm semver / Cargo semver / PEP 440 / System.Version —— 只能用纯三段数字。
jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve version and tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
          elif [ -n "${{ inputs.version }}" ]; then
            tag="${{ inputs.version }}"
          else
            tag="v0.0.${{ github.run_number }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Resolved: tag=$tag version=${tag#v}"

  build-server:
    name: Build aly-server (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: windows-latest
    strategy:
      matrix:
        goos: [windows, linux, darwin]
        goarch: [amd64]
        include:
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
        continue-on-error: true

      - name: Fallback — download Go
        if: steps.setup-go.outcome == 'failure'
        shell: cmd
        run: |
          echo "setup-go could not resolve Go version from go.mod, using go1.25.0..."
          powershell -Command "& {$(Invoke-WebRequest -Uri 'https://go.dev/dl/go1.25.0.windows-amd64.zip' -OutFile 'C:\go.zip'); Expand-Archive -Path 'C:\go.zip' -DestinationPath 'C:\go' -Force}"
          echo C:\go\go\bin>> %GITHUB_PATH%

      - name: Verify Go version
        run: go version

      - name: Build aly-server
        shell: cmd
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          cd server
          set EXT=
          if /I "%GOOS%"=="windows" set EXT=.exe
          set OUT=aly-server-%GOOS%-%GOARCH%%EXT%
          go build -ldflags="-s -w" -o %OUT% .

      - name: Upload aly-server artifact
        uses: actions/upload-artifact@v4
        with:
          name: aly-server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: server/aly-server-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}

  build-aly-publish:
    name: Build aly-publish (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: windows-latest
    strategy:
      matrix:
        # darwin 已出范围：安装包不带 macOS payload，也不再有独立 CLI 资产。
        goos: [windows, linux]
        goarch: [amd64]
        include:
          - goos: linux
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@v5
        with:
          go-version-file: publish/publish-cli/go.mod
        continue-on-error: true

      - name: Fallback — download Go
        if: steps.setup-go.outcome == 'failure'
        shell: cmd
        run: |
          echo "setup-go could not resolve Go version from go.mod, using go1.25.0..."
          powershell -Command "& {$(Invoke-WebRequest -Uri 'https://go.dev/dl/go1.25.0.windows-amd64.zip' -OutFile 'C:\go.zip'); Expand-Archive -Path 'C:\go.zip' -DestinationPath 'C:\go' -Force}"
          echo C:\go\go\bin>> %GITHUB_PATH%

      - name: Verify Go version
        run: go version

      - name: Build aly-publish
        shell: cmd
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          cd publish\publish-cli
          set EXT=
          if /I "%GOOS%"=="windows" set EXT=.exe
          set OUT=aly-publish-%GOOS%-%GOARCH%%EXT%
          go build -ldflags="-s -w" -o %OUT% .

      - name: Upload aly-publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: aly-publish-${{ matrix.goos }}-${{ matrix.goarch }}
          path: publish/publish-cli/aly-publish-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}

  build-aly-client:
    name: Build aly-client + aly-client-ui (Windows XP / 32-bit)
    runs-on: windows-latest
    env:
      GOPATH: C:\Users\runneradmin\go

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go 1.10
        id: setup-go
        uses: actions/setup-go@v5
        with:
          go-version: '1.10.8'
          cache: false
        continue-on-error: true

      - name: Fallback — manual Go 1.10 install
        if: steps.setup-go.outcome == 'failure'
        shell: cmd
        run: |
          echo "setup-go could not find Go 1.10, downloading manually..."
          curl -fsSL -o go1.10.8.windows-amd64.zip https://go.dev/dl/go1.10.8.windows-amd64.zip
          powershell -Command "Expand-Archive -Path go1.10.8.windows-amd64.zip -DestinationPath C:\go110"
          echo C:\go110\go\bin>> %GITHUB_PATH%
          echo GOROOT=C:\go110\go>> %GITHUB_ENV%
          if "%GOPATH%"=="" setx GOPATH C:\Users\runneradmin\go

      - name: Verify Go version
        run: go version

      - name: Setup GOPATH structure
        shell: cmd
        run: |
          mkdir "%GOPATH%\src\aly\client\aly-client-ui"
          xcopy /e /i /y client\aly-client "%GOPATH%\src\aly\client\aly-client"
          xcopy /e /i /y client\aly-client-ui\aly-client-winui "%GOPATH%\src\aly\client\aly-client-ui\aly-client-winui"

      - name: Build aly-client (console, 32-bit, XP compatible)
        shell: cmd
        env:
          GOOS: windows
          GOARCH: 386
          GO111MODULE: 'off'
          CGO_ENABLED: '0'
        run: go build -ldflags="-s -w" -o aly-client.exe aly/client/aly-client

      # aly-client-ui 是 walk 写的 GUI 前端：必须 -H=windowsgui（否则弹黑框），
      # 且依赖 rsrc.syso 里嵌入的 ComCtl32 v6 manifest（仓库已提交该文件，
      # go build 会自动链接同目录的 *.syso）。
      - name: Build aly-client-ui (GUI, 32-bit, XP compatible)
        shell: cmd
        env:
          GOOS: windows
          GOARCH: 386
          GO111MODULE: 'off'
          CGO_ENABLED: '0'
        run: go build -ldflags="-s -w -H=windowsgui" -o aly-client-ui.exe aly/client/aly-client-ui/aly-client-winui

      # 防止再次误发在 XP 上根本无法加载的产物：
      # 旧仓库里的 aly-client.exe 曾是 Go 1.26 构建（SubsystemVer=6.1），XP 直接拒绝。
      - name: Verify XP compatibility (PE header + manifest)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @('aly-client.exe', 'aly-client-ui.exe')
          foreach ($f in $files) {
            $path = (Resolve-Path $f).Path
            $bytes = [IO.File]::ReadAllBytes($path)
            $pe = [BitConverter]::ToInt32($bytes, 0x3C)
            if ([BitConverter]::ToUInt32($bytes, $pe) -ne 0x00004550) { throw "$f : bad PE signature" }
            $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
            $magic = [BitConverter]::ToUInt16($bytes, $pe + 24)
            $is64 = ($magic -eq 0x20B)
            $subOff = $pe + 24 + $(if ($is64) { 50 } else { 48 })
            $subMaj = [BitConverter]::ToUInt16($bytes, $subOff)
            $subMin = [BitConverter]::ToUInt16($bytes, $subOff + 2)
            Write-Host ('{0}: machine=0x{1:X4} subsystemVer={2}.{3}' -f $f, $machine, $subMaj, $subMin)
            if ($machine -ne 0x014C) { throw ('{0} is not 32-bit (machine=0x{1:X4})' -f $f, $machine) }
            if ($subMaj -gt 5) {
              throw ('{0} subsystem version {1}.{2} is > 5.1; Windows XP refuses to load it' -f $f, $subMaj, $subMin)
            }
          }
          $ui = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes((Resolve-Path 'aly-client-ui.exe').Path))
          if ($ui -notmatch 'Microsoft\.Windows\.Common-Controls') {
            throw 'aly-client-ui.exe has no ComCtl32 v6 manifest (rsrc.syso missing/not linked?)'
          }
          Write-Host 'XP compatibility checks passed.'

      - name: Upload client artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aly-client-win-xp
          path: |
            aly-client.exe
            aly-client-ui.exe

  build-aly-client-linux:
    name: Build aly-client + aly-client-ui (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false

      - name: Build Linux aly-client (amd64/arm64)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gopath/src/aly/client"
          cp -a client/aly-client "$RUNNER_TEMP/gopath/src/aly/client/aly-client"
          for arch in amd64 arm64; do
            mkdir -p "aly-client-linux-$arch"
            (cd "$RUNNER_TEMP/gopath/src/aly/client/aly-client" && \
              GOPATH="$RUNNER_TEMP/gopath" GO111MODULE=off GOOS=linux GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -o "$GITHUB_WORKSPACE/aly-client-linux-$arch/aly-client" aly/client/aly-client)
            chmod 0755 "aly-client-linux-$arch/aly-client"
          done

      - name: Test Linux aly-client (config/util/selfupdate)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/gopath/src/aly/client/aly-client"
          GOPATH="$RUNNER_TEMP/gopath" GO111MODULE=off GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go test ./config ./util ./selfupdate -count=1

      - name: Test & build Linux UI (MyGo native)
        shell: bash
        run: |
          set -euo pipefail
          cd client/aly-client-ui/aly-client-linuxui
          go tool mygo vet
          go test ./...
          go tool mygo build -platform linux/amd64,linux/arm64
          for arch in amd64 arm64; do
            cp -f "build/linux-$arch/aly-client-ui" \
              "$GITHUB_WORKSPACE/aly-client-linux-$arch/aly-client-ui-linux-$arch"
            chmod 0755 "$GITHUB_WORKSPACE/aly-client-linux-$arch/aly-client-ui-linux-$arch"
            mv "$GITHUB_WORKSPACE/aly-client-linux-$arch/aly-client" \
              "$GITHUB_WORKSPACE/aly-client-linux-$arch/aly-client-linux-$arch"
          done

      - name: Upload Linux client artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aly-client-linux
          path: |
            aly-client-linux-amd64/aly-client-linux-amd64
            aly-client-linux-amd64/aly-client-ui-linux-amd64
            aly-client-linux-arm64/aly-client-linux-arm64
            aly-client-linux-arm64/aly-client-ui-linux-arm64

  build-publish-gui-windows:
    name: Build AlyPublish for Windows (installer + portable zip)
    runs-on: windows-latest
    needs: [resolve-version, build-aly-publish, build-aly-client, build-aly-client-linux]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        shell: pwsh
        run: '"ALY_VERSION=${{ needs.resolve-version.outputs.version }}" | Out-File -FilePath $env:GITHUB_ENV -Append'

      - name: Test publish GUI
        shell: pwsh
        run: dotnet test publish/publish-gui/tests/AlyPublish.Tests/AlyPublish.Tests.csproj --configuration Release --nologo

      - name: Publish publish GUI (self-contained single file)
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE "publish\publish-gui\artifacts\app"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          dotnet publish publish/publish-gui/src/AlyPublish/AlyPublish.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:Version=$env:ALY_VERSION `
            --output $out

      # 客户端与发布 CLI 不再作为独立发布资产：全部打进 GUI 安装包，用户只装一个包。
      - name: Download payload artifacts
        uses: actions/download-artifact@v4
        with:
          name: aly-publish-windows-amd64
          path: publish/publish-gui/artifacts/staging

      - name: Download linux amd64 publish CLI
        uses: actions/download-artifact@v4
        with:
          name: aly-publish-linux-amd64
          path: publish/publish-gui/artifacts/staging

      - name: Download linux arm64 publish CLI
        uses: actions/download-artifact@v4
        with:
          name: aly-publish-linux-arm64
          path: publish/publish-gui/artifacts/staging

      - name: Download Windows updater
        uses: actions/download-artifact@v4
        with:
          name: aly-client-win-xp
          path: publish/publish-gui/artifacts/staging

      - name: Download Linux updater
        uses: actions/download-artifact@v4
        with:
          name: aly-client-linux
          path: publish/publish-gui/artifacts/staging

      # 铺 payload 布局 + 写 payload.json + 断言 9 个文件都在（缺了就 fail-fast）。
      # 铺 payload 布局 + 拷 payload.json + 断言 10 项全在（缺一即失败）。
      # 注意：铺装写成内联 pwsh，不用 .ps1 文件——脚本宿主对 .ps1 文件的解析能力有限
      # （if-表达式赋值会得到空值、Test-Path 不能包在 (-not (...)) 里），而内联 pwsh 宿主已验证可用。
      - name: Stage the package payload
        shell: pwsh
        run: |
          $app = "publish\publish-gui\artifacts\app"
          $stg = "publish\publish-gui\artifacts\staging"
          foreach ($d in @('publish-cli\windows-amd64', 'publish-cli\linux-amd64', 'publish-cli\linux-arm64', 'client\windows-x86', 'client\linux-amd64', 'client\linux-arm64')) {
            New-Item -ItemType Directory -Force -Path (Join-Path $app $d) | Out-Null
          }
          $src = Join-Path (Join-Path $stg "aly-publish-windows-amd64") "aly-publish-windows-amd64.exe"
          if (-not (Test-Path $src)) { $h = Get-ChildItem $stg -Recurse -Filter "aly-publish-windows-amd64.exe" -ErrorAction SilentlyContinue | Where-Object Length -Gt 0 | Select-Object -First 1; if ($h) { $src = $h.FullName } }
          if (-not (Test-Path $src)) { throw "payload source missing: aly-publish-windows-amd64.exe" }
          Copy-Item $src (Join-Path $app "publish-cli\windows-amd64\aly-publish.exe") -Force
          $src = $stg + "\aly-publish-linux-amd64"
          if (-not (Test-Path $src)) { $h = Get-ChildItem $stg -Recurse -Filter "aly-publish-linux-amd64" -ErrorAction SilentlyContinue | Where-Object Length -Gt 0 | Select-Object -First 1; if ($h) { $src = $h.FullName } }
          if (-not (Test-Path $src)) { throw "payload source missing: aly-publish-linux-amd64" }
          Copy-Item $src (Join-Path $app "publish-cli\linux-amd64\aly-publish") -Force
          $src = $stg + "\aly-publish-linux-arm64"
          if (-not (Test-Path $src)) { $h = Get-ChildItem $stg -Recurse -Filter "aly-publish-linux-arm64" -ErrorAction SilentlyContinue | Where-Object Length -Gt 0 | Select-Object -First 1; if ($h) { $src = $h.FullName } }
          if (-not (Test-Path $src)) { throw "payload source missing: aly-publish-linux-arm64" }
          Copy-Item $src (Join-Path $app "publish-cli\linux-arm64\aly-publish") -Force
          $src = $stg + "\aly-client.exe"
          if (-not (Test-Path $src)) { $h = Get-ChildItem $stg -Recurse -Filter "aly-client.exe" -ErrorAction SilentlyContinue | Where-Object Length -Gt 0 | Select-Object -First 1; if ($h) { $src = $h.FullName } }
          if (-not (Test-Path $src)) { throw "payload source missing: aly-client.exe" }
          Copy-Item $src (Join-Path $app "client\windows-x86\aly-client.exe") -Force
          $src = $stg + "\aly-client-ui.exe"
          if (-not (Test-Path $src)) { $h = Get-ChildItem $stg -Recurse -Filter "aly-client-ui.exe" -ErrorAction SilentlyContinue | Where-Object Length -Gt 0 | Select-Object -First 1; if ($h) { $src = $h.FullName } }
          if (-not (Test-Path $src)) { throw "payload source missing: aly-client-ui.exe" }
          Copy-Item $src (Join-Path $app "client\windows-x86\aly-client-ui.exe") -Force
          $src = $stg + "\aly-client-linux-amd64\aly-client-linux-amd64"
          if (-not (Test-Path $src)) { $h = Get-ChildItem $stg -Recurse -Filter "aly-client-linux-amd64" -ErrorAction SilentlyContinue | Where-Object Length -Gt 0 | Select-Object -First 1; if ($h) { $src = $h.FullName } }
          if (-not (Test-Path $src)) { throw "payload source missing: aly-client-linux-amd64" }
          Copy-Item $src (Join-Path $app "client\linux-amd64\aly-client") -Force
          $src = $stg + "\aly-client-linux-amd64\aly-client-ui-linux-amd64"
          if (-not (Test-Path $src)) { $h = Get-ChildItem $stg -Recurse -Filter "aly-client-ui-linux-amd64" -ErrorAction SilentlyContinue | Where-Object Length -Gt 0 | Select-Object -First 1; if ($h) { $src = $h.FullName } }
          if (-not (Test-Path $src)) { throw "payload source missing: aly-client-ui-linux-amd64" }
          Copy-Item $src (Join-Path $app "client\linux-amd64\aly-client-ui") -Force
          $src = $stg + "\aly-client-linux-arm64\aly-client-linux-arm64"
          if (-not (Test-Path $src)) { $h = Get-ChildItem $stg -Recurse -Filter "aly-client-linux-arm64" -ErrorAction SilentlyContinue | Where-Object Length -Gt 0 | Select-Object -First 1; if ($h) { $src = $h.FullName } }
          if (-not (Test-Path $src)) { throw "payload source missing: aly-client-linux-arm64" }
          Copy-Item $src (Join-Path $app "client\linux-arm64\aly-client") -Force
          $src = $stg + "\aly-client-linux-arm64\aly-client-ui-linux-arm64"
          if (-not (Test-Path $src)) { $h = Get-ChildItem $stg -Recurse -Filter "aly-client-ui-linux-arm64" -ErrorAction SilentlyContinue | Where-Object Length -Gt 0 | Select-Object -First 1; if ($h) { $src = $h.FullName } }
          if (-not (Test-Path $src)) { throw "payload source missing: aly-client-ui-linux-arm64" }
          Copy-Item $src (Join-Path $app "client\linux-arm64\aly-client-ui") -Force
          Copy-Item "publish\publish-gui\installer\payload.json" (Join-Path $app "payload.json") -Force
          Get-ChildItem $app -Recurse -Filter *.pdb -ErrorAction SilentlyContinue | Remove-Item -Force
          $need = @('publish-cli\windows-amd64\aly-publish.exe', 'publish-cli\linux-amd64\aly-publish', 'publish-cli\linux-arm64\aly-publish', 'client\windows-x86\aly-client.exe', 'client\windows-x86\aly-client-ui.exe', 'client\linux-amd64\aly-client', 'client\linux-amd64\aly-client-ui', 'client\linux-arm64\aly-client', 'client\linux-arm64\aly-client-ui', 'payload.json')
          $miss = 0
          foreach ($rel in $need) { if (-not (Test-Path (Join-Path $app $rel))) { Write-Error ("MISSING {0}" -f $rel); $miss = $miss + 1 } }
          if ($miss -gt 0) { throw ("package incomplete: {0} file(s) missing" -f $miss) }
          Get-ChildItem $app -Recurse | Select-Object FullName, Length

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = Get-ChildItem "${env:ProgramFiles(x86)}" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $iscc) { throw "Inno Setup ISCC.exe not found" }
          "ISCC=$($iscc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build installer
        shell: pwsh
        run: |
          & $env:ISCC "/DMyAppVersion=$env:ALY_VERSION" "publish\publish-gui\installer\AlyPublish.iss"

      - name: Build portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path "publish\publish-gui\artifacts\app\*" -DestinationPath "publish\publish-gui\artifacts\AlyPublish-win-x64.zip" -Force

      - name: Upload publish GUI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aly-publish-gui-windows-amd64
          path: |
            publish/publish-gui/artifacts/AlyPublish-Setup.exe
            publish/publish-gui/artifacts/AlyPublish-win-x64.zip

  build-publish-gui-linux:
    # 与 Windows 包同一个 windows-latest 工具链：linux-x64 / linux-arm64 的 Avalonia 产物来自
    # 包里的 runtimes/linux-*/native，交叉发布不需要 Linux 宿主；pwsh 与 ps1 也都在。
    name: Build AlyPublish for Linux (${{ matrix.rid }})
    runs-on: windows-latest
    needs: [resolve-version, build-aly-publish, build-aly-client, build-aly-client-linux]
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        shell: pwsh
        run: '"ALY_VERSION=${{ needs.resolve-version.outputs.version }}" | Out-File -FilePath $env:GITHUB_ENV -Append'

      - name: Test publish GUI
        shell: pwsh
        run: dotnet test publish/publish-gui/tests/AlyPublish.Tests/AlyPublish.Tests.csproj --configuration Release --nologo

      - name: Publish publish GUI for Linux
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE "publish\publish-gui\artifacts\app"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          dotnet publish publish/publish-gui/src/AlyPublish/AlyPublish.csproj `
            --configuration Release `
            --runtime ${{ matrix.rid }} `
            --self-contained true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:Version=$env:ALY_VERSION `
            --output $out

      - name: Download payload artifacts
        uses: actions/download-artifact@v4
        with:
          name: aly-publish-windows-amd64
          path: publish/publish-gui/artifacts/staging

      - name: Download linux amd64 publish CLI
        uses: actions/download-artifact@v4
        with:
          name: aly-publish-linux-amd64
          path: publish/publish-gui/artifacts/staging

      - name: Download linux arm64 publish CLI
        uses: actions/download-artifact@v4
        with:
          name: aly-publish-linux-arm64
          path: publish/publish-gui/artifacts/staging

      - name: Download Windows updater
        uses: actions/download-artifact@v4
        with:
          name: aly-client-win-xp
          path: publish/publish-gui/artifacts/staging

      - name: Download Linux updater
        uses: actions/download-artifact@v4
        with:
          name: aly-client-linux
          path: publish/publish-gui/artifacts/staging

      # 与 Windows 包同一套 payload（9 文件 + 本平台的 payload.json），铺装同样内联成 pwsh。
      - name: Stage the package payload
        shell: pwsh
        run: |
          $app = "publish\publish-gui\artifacts\app"
          $stg = "publish\publish-gui\artifacts\staging"
          foreach ($d in @('publish-cli\windows-amd64', 'publish-cli\linux-amd64', 'publish-cli\linux-arm64', 'client\windows-x86', 'client\linux-amd64', 'client\linux-arm64')) {
            New-Item -ItemType Directory -Force -Path (Join-Path $app $d) | Out-Null
          }
          $src = Join-Path (Join-Path $stg "aly-publish-windows-amd64") "aly-publish-windows-amd64.exe"
          if (-not (Test-Path $src)) { $h = Get-ChildItem $stg -Recurse -Filter "aly-publish-windows-amd64.exe" -ErrorAction SilentlyContinue | Where-Object Length -Gt 0 | Select-Object -First 1; if ($h) { $src = $h.FullName } }
          if (-not (Test-Path $src)) { throw "payload source missing: aly-publish-windows-amd64.exe" }
          Copy-Item $src (Join-Path $app "publish-cli\windows-amd64\aly-publish.exe") -Force
          $src = $stg + "\aly-publish-linux-amd64"
          if (-not (Test-Path $src)) { $h = Get-ChildItem $stg -Recurse -Filter "aly-publish-linux-amd64" -ErrorAction SilentlyContinue | Where-Object Length -Gt 0 | Select-Object -First 1; if ($h) { $src = $h.FullName } }
          if (-not (Test-Path $src)) { throw "payload source missing: aly-publish-linux-amd64" }
          Copy-Item $src (Join-Path $app "publish-cli\linux-amd64\aly-publish") -Force
          $src = $stg + "\aly-publish-linux-arm64"
          if (-not (Test-Path $src)) { $h = Get-ChildItem $stg -Recurse -Filter "aly-publish-linux-arm64" -ErrorAction SilentlyContinue | Where-Object Length -Gt 0 | Select-Object -First 1; if ($h) { $src = $h.FullName } }
          if (-not (Test-Path $src)) { throw "payload source missing: aly-publish-linux-arm64" }
          Copy-Item $src (Join-Path $app "publish-cli\linux-arm64\aly-publish") -Force
          $src = $stg + "\aly-client.exe"
          if (-not (Test-Path $src)) { $h = Get-ChildItem $stg -Recurse -Filter "aly-client.exe" -ErrorAction SilentlyContinue | Where-Object Length -Gt 0 | Select-Object -First 1; if ($h) { $src = $h.FullName } }
          if (-not (Test-Path $src)) { throw "payload source missing: aly-client.exe" }
          Copy-Item $src (Join-Path $app "client\windows-x86\aly-client.exe") -Force
          $src = $stg + "\aly-client-ui.exe"
          if (-not (Test-Path $src)) { $h = Get-ChildItem $stg -Recurse -Filter "aly-client-ui.exe" -ErrorAction SilentlyContinue | Where-Object Length -Gt 0 | Select-Object -First 1; if ($h) { $src = $h.FullName } }
          if (-not (Test-Path $src)) { throw "payload source missing: aly-client-ui.exe" }
          Copy-Item $src (Join-Path $app "client\windows-x86\aly-client-ui.exe") -Force
          $src = $stg + "\aly-client-linux-amd64\aly-client-linux-amd64"
          if (-not (Test-Path $src)) { $h = Get-ChildItem $stg -Recurse -Filter "aly-client-linux-amd64" -ErrorAction SilentlyContinue | Where-Object Length -Gt 0 | Select-Object -First 1; if ($h) { $src = $h.FullName } }
          if (-not (Test-Path $src)) { throw "payload source missing: aly-client-linux-amd64" }
          Copy-Item $src (Join-Path $app "client\linux-amd64\aly-client") -Force
          $src = $stg + "\aly-client-linux-amd64\aly-client-ui-linux-amd64"
          if (-not (Test-Path $src)) { $h = Get-ChildItem $stg -Recurse -Filter "aly-client-ui-linux-amd64" -ErrorAction SilentlyContinue | Where-Object Length -Gt 0 | Select-Object -First 1; if ($h) { $src = $h.FullName } }
          if (-not (Test-Path $src)) { throw "payload source missing: aly-client-ui-linux-amd64" }
          Copy-Item $src (Join-Path $app "client\linux-amd64\aly-client-ui") -Force
          $src = $stg + "\aly-client-linux-arm64\aly-client-linux-arm64"
          if (-not (Test-Path $src)) { $h = Get-ChildItem $stg -Recurse -Filter "aly-client-linux-arm64" -ErrorAction SilentlyContinue | Where-Object Length -Gt 0 | Select-Object -First 1; if ($h) { $src = $h.FullName } }
          if (-not (Test-Path $src)) { throw "payload source missing: aly-client-linux-arm64" }
          Copy-Item $src (Join-Path $app "client\linux-arm64\aly-client") -Force
          $src = $stg + "\aly-client-linux-arm64\aly-client-ui-linux-arm64"
          if (-not (Test-Path $src)) { $h = Get-ChildItem $stg -Recurse -Filter "aly-client-ui-linux-arm64" -ErrorAction SilentlyContinue | Where-Object Length -Gt 0 | Select-Object -First 1; if ($h) { $src = $h.FullName } }
          if (-not (Test-Path $src)) { throw "payload source missing: aly-client-ui-linux-arm64" }
          Copy-Item $src (Join-Path $app "client\linux-arm64\aly-client-ui") -Force
          Copy-Item (Join-Path "publish\publish-gui\installer" "payload.${{ matrix.rid }}.json") (Join-Path $app "payload.json") -Force
          Get-ChildItem $app -Recurse -Filter *.pdb -ErrorAction SilentlyContinue | Remove-Item -Force
          $need = @('publish-cli\windows-amd64\aly-publish.exe', 'publish-cli\linux-amd64\aly-publish', 'publish-cli\linux-arm64\aly-publish', 'client\windows-x86\aly-client.exe', 'client\windows-x86\aly-client-ui.exe', 'client\linux-amd64\aly-client', 'client\linux-amd64\aly-client-ui', 'client\linux-arm64\aly-client', 'client\linux-arm64\aly-client-ui', 'payload.json')
          $miss = 0
          foreach ($rel in $need) { if (-not (Test-Path (Join-Path $app $rel))) { Write-Error ("MISSING {0}" -f $rel); $miss = $miss + 1 } }
          if ($miss -gt 0) { throw ("package incomplete: {0} file(s) missing" -f $miss) }
          Get-ChildItem $app -Recurse | Select-Object FullName, Length

      - name: Add the Linux installer scripts
        shell: pwsh
        run: |
          $app = Join-Path $env:GITHUB_WORKSPACE "publish\publish-gui\artifacts\app"
          Copy-Item "publish\publish-gui\installer\linux\install.sh" $app -Force
          Copy-Item "publish\publish-gui\installer\linux\uninstall.sh" $app -Force

      - name: Compress the Linux package
        shell: pwsh
        run: Compress-Archive -Path "publish\publish-gui\artifacts\app\*" -DestinationPath "publish\publish-gui\artifacts\AlyPublish-${{ matrix.rid }}.zip" -Force

      - name: Upload the Linux package
        uses: actions/upload-artifact@v4
        with:
          name: aly-publish-gui-${{ matrix.rid }}
          path: publish/publish-gui/artifacts/AlyPublish-${{ matrix.rid }}.zip

  build-csharp-sdk:
    name: Build AlyClient.CSharpSDK nupkg
    runs-on: windows-latest
    needs: [resolve-version]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        shell: pwsh
        run: '"ALY_VERSION=${{ needs.resolve-version.outputs.version }}" | Out-File -FilePath $env:GITHUB_ENV -Append'

      - name: Setup Go (protocol tool)
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/alyprotocol/go.mod
          cache: false

      - name: Verify protocol models are generated
        working-directory: tools/alyprotocol
        run: go run . -check

      - name: Test fake client
        working-directory: tools/fake-aly-client
        run: go test ./...

      - name: Build fake client for conformance
        working-directory: tools/fake-aly-client
        run: go build -o $env:RUNNER_TEMP/fake-aly-client.exe .

      - name: Build SDK conformance tests
        run: dotnet build client/aly-client-sdk/AlyClient.CSharpSDK/AlySdkConformance/AlySdkConformance.csproj --configuration Release --nologo

      - name: Run SDK conformance tests
        shell: pwsh
        run: |
          $fake = Join-Path $env:RUNNER_TEMP "fake-aly-client.exe"
          & "client\aly-client-sdk\AlyClient.CSharpSDK\AlySdkConformance\bin\Release\net40\AlySdkConformance.exe" $fake "spec\fixtures\scenarios"

      - name: Pack SDK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/sdk | Out-Null
          dotnet pack client/aly-client-sdk/AlyClient.CSharpSDK/AlyClient.CSharpSDK/AlyClient.CSharpSDK.csproj `
            --configuration Release `
            --output artifacts/sdk `
            -p:Version=$env:ALY_VERSION

      - name: Build minimal sample
        shell: pwsh
        run: dotnet build client/aly-client-sdk/samples/MinimalHost/MinimalHost.csproj --configuration Release --nologo

      - name: Verify nupkg
        shell: pwsh
        run: Get-ChildItem artifacts/sdk | Select-Object Name, Length

      - name: Package C# SDK zip
        shell: pwsh
        run: |
          $stage = "artifacts/sdk/csharp"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "artifacts/sdk/*.nupkg" $stage -Force
          Copy-Item "client/aly-client-sdk/AlyClient.CSharpSDK/AlyClient.CSharpSDK/README.md" $stage -Force
          Compress-Archive -Path "$stage\*" -DestinationPath "artifacts/sdk/AlyClient.CSharpSDK-$env:ALY_VERSION.zip" -Force

      - name: Upload SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aly-csharp-sdk
          path: |
            artifacts/sdk/*.nupkg
            artifacts/sdk/*.zip

  build-sdk-packages:
    name: Build all language SDK zip packages
    runs-on: windows-latest
    needs: [resolve-version]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        shell: pwsh
        run: '"ALY_VERSION=${{ needs.resolve-version.outputs.version }}" | Out-File -FilePath $env:GITHUB_ENV -Append'

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Go (protocol verification)
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/alyprotocol/go.mod
          cache: false

      - name: Install MinGW-w64 (C++)
        run: choco install mingw -y --no-progress

      - name: Install Free Pascal (Pascal)
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "fpc-3.2.2.i386-win32.exe"
          curl.exe -L --fail -o $installer "https://downloads.freepascal.org/fpc/dist/3.2.2/i386-win32/fpc-3.2.2.i386-win32.exe"
          Start-Process -FilePath $installer -Wait -ArgumentList `
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=C:\FPC\3.2.2"

      - name: Verify protocol models and fixtures
        working-directory: tools/alyprotocol
        run: go run . -check

      - name: Build SDK zip packages
        shell: pwsh
        run: tools/package-sdks/package-sdks.ps1 -Version $env:ALY_VERSION -Out artifacts/sdks -SkipCSharp

      - name: Upload SDK zip packages
        uses: actions/upload-artifact@v4
        with:
          name: sdk-packages
          path: artifacts/sdks/*.zip

  upload-release-assets:
    name: Upload to Release
    # release 事件 = 正式发布；手动触发仅在勾选 upload_to_release 时上传
    if: github.event_name == 'release' || inputs.upload_to_release == true
    needs: [resolve-version, build-server, build-publish-gui-windows, build-publish-gui-linux, build-csharp-sdk, build-sdk-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # download-artifact@v4 不指定 path 时会下载到 <artifact名>/ 子目录，
      # 这里统一收拢到 artifacts/ 目录，供后续 find 扫描上传。
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: ls -laR artifacts

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.resolve-version.outputs.tag }}"
          mapfile -t files < <(find artifacts -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release assets downloaded" >&2
            exit 1
          fi
          printf 'Uploading %d assets to %s\n' "${#files[@]}" "$TAG"
          # 手动发布模式下 tag 可能尚无 release，自动补建
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG not found, creating it..."
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" "${files[@]}" --clobber


